name: Build app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sunnathan/thermopt

jobs:
  build:
    name: Image multi-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Vérifier la version
        id: version
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          import yaml

          config = yaml.safe_load(
              Path("thermopt_app/config.yaml").read_text(encoding="utf-8")
          )
          version = str(config["version"])
          print(f"config.yaml version = {version}")

          ref = os.environ.get("GITHUB_REF_NAME", "")
          if ref.startswith("v"):
              tag = ref[1:]
              if tag != version:
                  sys.exit(
                      f"Le tag ({tag}) et config.yaml ({version}) divergent. "
                      "Bump la version de l'app."
                  )
              print(f"tag {ref} cohérent")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"value={version}\n")
          PY

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: thermopt_app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
