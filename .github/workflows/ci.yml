name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Ruff (lint)
        run: ruff check lib thermopt_app tests

      - name: Ruff (format)
        run: ruff format --check lib thermopt_app tests

      - name: mypy
        run: mypy lib/thermopt_lib thermopt_app/app

      - name: Tests
        run: pytest -q
