name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Vérifier que le tag correspond à config.yaml
        run: |
          pip install --quiet pyyaml
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          import yaml

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          app = yaml.safe_load(Path("thermopt_app/config.yaml").read_text(encoding="utf-8"))
          version = str(app["version"])
          print(f"tag={tag} config.yaml={version}")
          if tag != version:
              sys.exit(f"config.yaml ({version}) ne correspond pas au tag ({tag}).")
          PY

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            Installation : Apps → Dépôts → ce dépôt → installer ThermOpt.

            La version de `thermopt_app/config.yaml` doit rester identique au tag
            (vérifié par ce workflow).
