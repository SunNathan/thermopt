# ThermOpt — vue Lovelace prête à coller
#
# Utilisation : Tableau de bord -> Modifier -> ⋮ -> Éditeur de configuration brute,
# puis ajouter ce bloc dans `views:`.
#
# Cette vue ne référence QUE des entités dont l'identifiant est garanti
# (sensor.thermopt_*). Les pièces sont lues depuis les attributs de
# sensor.thermopt_pieces : aucun nom de pièce n'est codé en dur, donc la vue
# fonctionne quel que soit le nom que tu as donné à tes pièces.
#
# Pour obtenir des cartes natives par pièce (avec les vrais entity_id),
# appuie sur le bouton « Générer la vue » de l'intégration : il produit un YAML
# adapté et le publie dans une notification.
views:
  - title: ThermOpt
    path: thermopt
    icon: mdi:home-thermometer
    cards:
      # --- La question centrale : est-ce que ça pilote le chauffage ? ---
      - type: markdown
        content: >-
          {% set actif = state_attr('sensor.thermopt_statut', 'pilotage_actif') %}
          {% if actif %}
          ## 🟢 Pilotage actif

          ThermOpt applique ses ordres aux radiateurs.
          {% else %}
          ## ⚪ Pilotage inactif

          **Aucun ordre n'est envoyé aux radiateurs.**

          {{ state_attr('sensor.thermopt_statut', 'raison') }}
          {% endif %}

          Mode : **{{ states('sensor.thermopt_statut') }}** ·
          Dernière commande : **{{ states('sensor.thermopt_derniere_commande') }}**

      - type: glance
        title: Superviseur
        columns: 3
        entities:
          - entity: sensor.thermopt_statut
            name: Mode
          - entity: binary_sensor.thermopt_mode_degrade
            name: Santé
          - entity: binary_sensor.thermopt_heures_creuses
            name: Tarif
          - entity: sensor.thermopt_prix_actuel
            name: Prix
          - entity: sensor.thermopt_dernier_cycle
            name: Cycle
          - entity: sensor.thermopt_pieces
            name: Pièces

      # --- Tableau des pièces, construit depuis les attributs ---
      - type: markdown
        content: >-
          {%- set rooms = state_attr('sensor.thermopt_pieces', 'rooms') or [] -%}
          {%- if rooms %}
          | Pièce | Température | Consigne | Ordre appliqué | Source | Puissance |
          |---|---|---|---|---|---|
          {%- for r in rooms %}
          | {{ r.name }} | {{ r.t_air if r.t_air is not none else '—' }} °C | {{ r.target_min if r.target_min is not none else '—' }} – {{ r.target_max if r.target_max is not none else '—' }} °C | {{ r.applied_label if r.applied_label else '—' }} | {{ r.source }} | {{ r.power if r.power is not none else '—' }} W |
          {%- endfor %}
          {%- else %}
          Aucune pièce configurée. Ajoute-la depuis la carte de l'intégration ThermOpt.
          {%- endif %}

      # --- Raisons lisibles, uniquement si quelque chose ne va pas ---
      - type: conditional
        conditions:
          - entity: binary_sensor.thermopt_mode_degrade
            state: "on"
        card:
          type: markdown
          content: >-
            ## ⚠️ Situation dégradée

            {%- for line in state_attr('binary_sensor.thermopt_mode_degrade', 'details') or [] %}
            - {{ line }}
            {%- endfor %}
