# ThermOpt — tableau de bord prêt à coller
#
# Utilisation : Paramètres -> Tableaux de bord -> ⋯ -> Modifier -> ⋯ ->
# Éditeur de configuration brute, puis TOUT SÉLECTIONNER et remplacer par ce
# fichier. C'est un tableau de bord complet (title + views), pas un fragment :
# coller un fragment de vue provoque l'erreur
# « Expected an object, but received: [object Object] ».
#
# Cette vue ne référence QUE des entités dont l'identifiant est garanti
# (sensor.thermopt_*). Les pièces sont lues depuis les attributs de
# sensor.thermopt_pieces : aucun nom de pièce n'est codé en dur.
#
# Pour des cartes natives par pièce (avec les vrais entity_id), appuie sur le
# bouton « Générer la vue » de l'intégration : il produit un tableau de bord
# adapté et le publie dans une notification.
title: ThermOpt
views:
  - title: ThermOpt
    path: thermopt
    icon: mdi:home-thermometer
    cards:
      # --- La question centrale : est-ce que ça pilote le chauffage ? ---
      - type: markdown
        content: |
          {% set actif = state_attr('sensor.thermopt_statut', 'pilotage_actif') %}
          {% set portee = state_attr('sensor.thermopt_statut', 'portee') %}
          {% if actif and portee == 'optimiseur' %}
          ## 🟢 Pilotage complet

          ThermOpt optimise les ordres selon le tarif et la météo.
          {% elif actif %}
          ## 🟡 Sécurité seule

          ThermOpt n'envoie un ordre que si une pièce passe sous sa borne de
          confort. L'optimisation arrivera plus tard.

          {{ state_attr('sensor.thermopt_statut', 'raison') }}
          {% else %}
          ## ⚪ Pilotage inactif

          **Aucun ordre n'est envoyé aux radiateurs.**

          {{ state_attr('sensor.thermopt_statut', 'raison') }}
          {% endif %}

          Mode : **{{ states('sensor.thermopt_statut') }}** ·
          Dernière commande : **{{ states('sensor.thermopt_derniere_commande') }}**

      - type: glance
        title: Superviseur
        columns: 3
        entities:
          - entity: sensor.thermopt_statut
            name: Mode
          - entity: binary_sensor.thermopt_mode_degrade
            name: Santé
          - entity: binary_sensor.thermopt_heures_creuses
            name: Tarif
          - entity: sensor.thermopt_prix_actuel
            name: Prix
          - entity: sensor.thermopt_dernier_cycle
            name: Cycle
          - entity: sensor.thermopt_pieces
            name: Pièces

      # --- Tableau des pièces, construit depuis les attributs ---
      - type: markdown
        content: |
          {%- set rooms = state_attr('sensor.thermopt_pieces', 'rooms') or [] -%}
          {%- if rooms %}
          | Pièce | Température | Consigne | Ordre appliqué | Source | Sécurité |
          |---|---|---|---|---|---|
          {%- for r in rooms %}
          | {{ r.name }} | {{ r.t_air if r.t_air is not none else '—' }} °C | {{ r.target_min if r.target_min is not none else '—' }} – {{ r.target_max if r.target_max is not none else '—' }} °C | {{ r.applied_label if r.applied_label else '—' }} | {{ r.source }} | {{ r.safety }} |
          {%- endfor %}
          {%- else %}
          Aucune pièce configurée. Ajoute-la depuis la carte de l'intégration ThermOpt.
          {%- endif %}

      # --- Raisons lisibles, uniquement si quelque chose ne va pas ---
      - type: conditional
        conditions:
          - entity: binary_sensor.thermopt_mode_degrade
            state: "on"
        card:
          type: markdown
          content: |
            ## ⚠️ Situation dégradée

            {% for line in state_attr('binary_sensor.thermopt_mode_degrade', 'details') or [] %}
            - {{ line }}
            {% endfor %}
