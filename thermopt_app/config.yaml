name: "ThermOpt"
version: "0.5.0"
slug: "thermopt"
description: "Pilotage optimal du chauffage fil pilote (POC personnel)"
url: "https://github.com/SunNathan/thermopt"
arch:
  - aarch64
  - amd64
image: "ghcr.io/sunnathan/thermopt"
startup: application
boot: auto
stage: experimental
homeassistant: "2026.10.0"
homeassistant_api: true
services:
  - mqtt:want
ingress: true
ingress_port: 8099
panel_icon: "mdi:home-thermometer"
panel_title: "ThermOpt"
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  log_level: "info"
schema:
  log_level: list(debug|info|warning|error)
